<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language == 'en' ? 'en' : 'zh-CN'}">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="#{exam.sessionTitle}">考试进行中 · CertForge</title><link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body data-page="exam"><div th:replace="~{fragments :: topbar('exam')}"></div><div class="app-shell"><div th:replace="~{fragments :: sidebar('exam')}"></div>
<main class="main-content practice-content" th:data-started-at="${startedAtMillis}"><div class="practice-header"><div><p class="eyebrow" th:text="#{exam.eyebrow}">EXAM MODE / 模拟考试</p><h1 th:text="${#locale.language == 'en' ? 'Question ' + question.questionNumber : '第 ' + question.questionNumber + ' 题'}">Question 1</h1><span class="topic-tag" th:text="${question.topic}">Topic 1</span></div><div class="exam-timer-wrap"><span class="timer-label" th:text="#{exam.timeUsed}">TIME USED</span><strong id="exam-timer">00:00:00</strong></div></div>
<div class="practice-layout"><section class="question-card exam-card"><div class="question-card-top"><span class="question-type" th:text="${question.multipleChoice ? #messages.msg('exam.questionTypeMultiple') : #messages.msg('exam.questionTypeSingle')}">SINGLE SELECT · 单选</span><form method="post" th:action="@{/exam/flag}"><button class="star-button" th:classappend="${currentFlagged} ? 'starred' : ''" type="submit" th:text="${currentFlagged ? '⚑ ' + #messages.msg('common.flag') : '⚐ ' + #messages.msg('common.flag')}">⚑ 标记复查</button></form></div><h2 class="question-text" th:text="${question.questionText}">Question text</h2><p class="instruction" th:text="#{exam.instruction}">考试模式 · 选择后保存，不会立即判分</p>
<form id="exam-form" method="post" th:action="@{/exam/save}"><div class="option-list"><label th:each="option : ${question.options}" class="option-row answer-option" th:for="${'exam-' + option.label}"><input th:id="${'exam-' + option.label}" name="answers" th:type="${question.multipleChoice ? 'checkbox' : 'radio'}" th:value="${option.label}" th:checked="${selectedAnswers.contains(option.label)}" th:attr="data-key=${option.label}"><span class="option-label" th:text="${option.label}">A</span><span class="option-copy" th:text="${option.text}">Option</span></label></div><div class="form-actions question-actions"><button class="button primary" type="submit" th:text="#{exam.saveNext}">保存并下一题 →</button></div></form></section>
<aside class="navigator-panel panel"><div class="panel-heading"><div><p class="eyebrow" th:text="#{exam.navigator}">EXAM NAVIGATOR</p><h2 th:text="|${position} / ${total}|">1 / 10</h2></div></div><div class="navigator-grid"><form th:each="item, itemStat : ${navigator}" method="post" th:action="@{/exam/goto}"><input type="hidden" name="index" th:value="${itemStat.index}"><button class="nav-number" type="submit" th:classappend="|${item.state} ${item.current ? 'current' : ''} ${item.flagged ? 'flagged' : ''}|" th:text="${item.questionNumber}">1</button></form></div><div class="navigator-legend"><span><i class="legend-box"></i><span th:text="#{common.unanswered}">未答</span></span><span><i class="legend-box answered"></i><span th:text="#{exam.saved}">已保存</span></span><span><i class="legend-box flagged"></i><span th:text="#{common.flag}">标记</span></span></div><form class="submit-exam-form" method="post" th:action="@{/exam/submit}"><button class="button danger full" type="submit" th:text="#{exam.submit}">提交考试</button></form></aside></div>
<div class="bottom-actions"><form method="post" th:action="@{/exam/save}"><input type="hidden" name="direction" value="previous"><button class="button secondary" type="submit" th:disabled="${!hasPrevious}" th:text="#{common.previous}">← 上一题</button></form><span class="muted small" th:text="#{exam.resultNote}">提交后才会显示成绩与解析信息</span><span></span></div>
</main></div><script th:src="@{/js/app.js}"></script></body></html>
