<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language == 'en' ? 'en' : 'zh-CN'}">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="#{review.setupTitle}">开始练习 · CertForge</title><link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body data-page="review"><div th:replace="~{fragments :: topbar('review')}"></div><div class="app-shell"><div th:replace="~{fragments :: sidebar('review')}"></div>
<main class="main-content narrow-content"><section class="page-heading compact"><div><p class="eyebrow" th:text="#{review.eyebrow}">REVIEW MODE / 即时答题</p><h1 th:text="#{review.heading}">设置一轮练习</h1><p class="muted" th:text="#{review.setupDescription}">提交前不会显示正确答案或社区投票。</p></div></section>
<form class="setup-card panel" method="post" th:action="@{/review/start}">
    <div class="form-error" th:if="${error}" th:text="${error}">没有题目</div>
    <fieldset><legend th:text="#{review.rangeLegend}">选择题目范围</legend><div class="selection-grid">
        <label class="selection-card"><input type="radio" name="selection" value="all" th:checked="${selectedFilter == 'all'}"><span><b th:text="#{review.all}">全部题目</b><small th:text="${totalQuestions + ' ' + #messages.msg('common.questions')}">127 道题</small></span></label>
        <label class="selection-card"><input type="radio" name="selection" value="range" th:checked="${selectedFilter == 'range'}"><span><b th:text="#{review.range}">题号范围</b><small th:text="#{review.rangeHint}">例如 1-20 或 21-50</small></span></label>
        <label class="selection-card"><input type="radio" name="selection" value="random" th:checked="${selectedFilter == 'random'}"><span><b th:text="#{review.random}">随机抽题</b><small th:text="#{review.randomHint}">从题库随机抽取 N 题</small></span></label>
        <label class="selection-card"><input type="radio" name="selection" value="wrong" th:checked="${selectedFilter == 'wrong'}"><span><b th:text="#{review.wrong}">错题</b><small th:text="#{review.wrongHint}">曾经答错过的题目</small></span></label>
        <label class="selection-card"><input type="radio" name="selection" value="starred" th:checked="${selectedFilter == 'starred'}"><span><b th:text="#{review.starred}">星标题</b><small th:text="#{review.starredHint}">只练习收藏题</small></span></label>
        <label class="selection-card"><input type="radio" name="selection" value="unanswered" th:checked="${selectedFilter == 'unanswered'}"><span><b th:text="#{review.unanswered}">未答题</b><small th:text="#{review.unansweredHint}">优先覆盖新题</small></span></label>
    </div></fieldset>
    <div class="form-grid"><label><span th:text="#{review.rangeInput}">题号范围</span><input name="range" th:placeholder="#{review.rangeHint}"></label><label><span th:text="#{review.randomCount}">随机题数</span><input type="number" name="randomCount" min="1" max="127" value="10"></label><label><span th:text="#{common.allTypes}">题型</span><select name="type"><option value="ALL" th:text="#{common.allTypes}">全部题型</option><option value="SINGLE" th:text="#{common.single}">单选题</option><option value="MULTIPLE" th:text="#{common.multiple}">多选题</option></select></label><label><span th:text="#{common.topic}">Topic</span><select name="topic"><option value="" th:text="#{common.allTopics}">全部 Topic</option><option th:each="item : ${topics}" th:value="${item}" th:text="${item}"></option></select></label></div>
    <label class="wide-label"><span th:text="#{review.keyword}">关键词</span><input name="search" th:placeholder="#{review.keywordPlaceholder}"></label>
    <div class="toggle-row"><label><input type="checkbox" name="shuffleQuestions" value="true"><span th:text="#{review.shuffleQuestions}">打乱题目顺序</span></label><label><input type="checkbox" name="shuffleOptions" value="true"><span th:text="#{review.shuffleOptions}">打乱选项顺序</span></label><label><input type="checkbox" name="starredOnly" value="true"><span th:text="#{study.starredOnly}">只看星标</span></label><label><input type="checkbox" name="wrongOnly" value="true"><span th:text="#{study.wrongOnly}">只看错题</span></label></div>
    <div class="form-actions"><a class="button secondary" th:href="@{/}" th:text="#{common.cancel}">取消</a><button class="button primary" type="submit" th:text="#{review.start}">开始即时答题 →</button></div>
</form></main></div><script th:src="@{/js/app.js}"></script></body></html>
