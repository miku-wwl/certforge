<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language == 'en' ? 'en' : 'zh-CN'}">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="#{exam.title}">模拟考试 · CertForge</title><link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body data-page="exam"><div th:replace="~{fragments :: topbar('exam')}"></div><div class="app-shell"><div th:replace="~{fragments :: sidebar('exam')}"></div>
<main class="main-content narrow-content"><section class="page-heading compact"><div><p class="eyebrow" th:text="#{exam.eyebrow}">EXAM MODE / 模拟考试</p><h1 th:text="#{exam.setupHeading}">开始一场模拟考试</h1><p class="muted" th:text="#{exam.setupDescription}">考试过程中不会显示正确答案、社区投票或检查按钮，提交后统一评分。</p></div></section>
<form class="setup-card panel exam-start-card" method="post" th:action="@{/exam/start}"><div class="exam-hero"><span class="exam-icon">⏱</span><div><h2 th:text="#{exam.practiceExam}">AIP-C01 Practice Exam</h2><p class="muted" th:text="#{exam.randomDescription(${totalQuestions})}">从 117 道题中随机抽取，按真实考试节奏完成。</p></div></div><fieldset><legend th:text="#{exam.countLegend}">题目数量</legend><div class="exam-counts"><label th:each="count : ${examCounts}" class="count-choice"><input type="radio" name="number" th:value="${count}" th:checked="${count == 10}"><span th:text="${count}">10</span></label></div></fieldset><div class="toggle-row"><label><input type="checkbox" name="shuffleQuestions" value="true" checked><span th:text="#{exam.shuffleRecommended}">随机抽题（推荐）</span></label><label><input type="checkbox" name="shuffleOptions" value="true"><span th:text="#{review.shuffleOptions}">打乱选项顺序</span></label></div><div class="form-actions"><a class="button secondary" th:href="@{/}" th:text="#{common.cancel}">取消</a><button class="button primary" type="submit" th:text="#{exam.start}">开始考试 →</button></div></form></main></div><script th:src="@{/js/app.js}"></script></body></html>
