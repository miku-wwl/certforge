<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language == 'en' ? 'en' : 'zh-CN'}">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="#{wrong.title}">错题复习 · CertForge</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body data-page="wrong"><div th:replace="~{fragments :: topbar('wrong')}"></div><div class="app-shell"><div th:replace="~{fragments :: sidebar('wrong')}"></div>
<main class="main-content"><section class="page-heading compact"><div><p class="eyebrow" th:text="#{wrong.eyebrow}">WRONG ANSWERS / 错题</p><h1 th:text="#{wrong.heading}">错题复习</h1><p class="muted" th:text="#{wrong.description}">保留完整历史；最近连续答对两次会标记为 MASTERED。</p></div><a class="button primary" th:if="${!wrongQuestions.isEmpty()}" th:href="@{/review(filter='wrong')}" th:text="#{wrong.start}">开始错题练习 →</a></section>
<section class="panel table-panel"><div class="table-heading"><div><h2 th:text="#{wrong.tableHeading}">曾经答错的题目</h2><span class="muted" th:text="${wrongQuestions.size() + ' ' + #messages.msg('common.questions')}">0 道题</span></div></div><div class="table-wrap" th:if="${!wrongQuestions.isEmpty()}"><table><thead><tr><th th:text="#{common.question}">题目</th><th th:text="#{wrong.lastSelection}">最近选择</th><th th:text="#{wrong.incorrectCount}">答错次数</th><th th:text="#{wrong.lastAttempt}">最近答题</th><th th:text="#{wrong.status}">状态</th></tr></thead><tbody><tr th:each="row : ${wrongQuestions}"><td><a class="question-link" th:href="@{/study(q=${row.question.questionNumber}, wrongOnly=true)}" th:text="${#locale.language == 'en' ? 'Question ' + row.question.questionNumber : '第 ' + row.question.questionNumber + ' 题'}">Question 1</a><small th:text="${row.question.topic}">Topic 1</small></td><td th:text="${row.lastSelectedAnswers.isEmpty() ? #messages.msg('common.unanswered') : #strings.listJoin(row.lastSelectedAnswers, ', ')}">A</td><td><span class="wrong-count" th:text="${row.incorrectCount}">2</span></td><td th:text="${row.lastAttempt}">-</td><td><span class="status-pill mastered" th:if="${row.mastered}" th:text="#{wrong.mastered}">MASTERED</span><span class="status-pill learning" th:unless="${row.mastered}" th:text="#{wrong.learning}">LEARNING</span></td></tr></tbody></table></div><div class="empty-state small-empty" th:if="${wrongQuestions.isEmpty()}"><div class="empty-icon">✓</div><h2 th:text="#{wrong.emptyHeading}">还没有错题</h2><p class="muted" th:text="#{wrong.emptyDescription}">在即时答题或模拟考试中答错的题目会出现在这里。</p><a class="button secondary" th:href="@{/review}" th:text="#{wrong.startRound}">开始一轮练习</a></div></section></main></div><script th:src="@{/js/app.js}"></script></body></html>
