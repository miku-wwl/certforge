<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language == 'en' ? 'en' : 'zh-CN'}">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="#{exam.resultTitle}">考试结果 · CertForge</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body data-page="exam"><div th:replace="~{fragments :: topbar('exam')}"></div><div class="app-shell"><div th:replace="~{fragments :: sidebar('exam')}"></div>
<main class="main-content"><section class="result-hero"><p class="eyebrow light" th:text="#{exam.complete}">EXAM COMPLETE / 考试完成</p><h1 th:text="#{exam.resultHeading}">本轮成绩</h1><div class="result-score" th:text="${#numbers.formatDecimal(examResult.percentage, 1, 1) + '%'}">80.0%</div><p th:text="#{exam.timeSummary(${examResult.timeUsedSeconds / 60}, ${examResult.timeUsedSeconds % 60}, ${examResult.total})}">用时 12 分 · 共 10 题</p></section>
<section class="stats-grid result-stats"><div class="stat-card"><span class="stat-label" th:text="#{common.correct}">答对</span><strong class="text-green" th:text="${examResult.correct}">8</strong><span class="stat-icon green">✓</span></div><div class="stat-card"><span class="stat-label" th:text="#{common.incorrect}">答错</span><strong class="text-red" th:text="${examResult.incorrect}">2</strong><span class="stat-icon red">!</span></div><div class="stat-card"><span class="stat-label" th:text="#{common.unanswered}">未作答</span><strong th:text="${examResult.unanswered}">0</strong><span class="stat-icon gray">—</span></div><div class="stat-card"><span class="stat-label" th:text="#{exam.score}">得分</span><strong th:text="${#numbers.formatDecimal(examResult.percentage, 1, 1) + '%'}">80.0%</strong><span class="stat-icon violet">%</span></div></section>
<div class="result-actions"><a class="button primary" th:href="@{/exam}" th:text="#{exam.tryAgain}">再来一场</a><a class="button secondary" th:href="@{/}" th:text="#{exam.backDashboard}">返回总览</a></div>
<section class="result-review"><div class="section-heading"><div><p class="eyebrow" th:text="#{exam.answerReview}">ANSWER REVIEW</p><h2 th:text="#{exam.reviewHeading}">逐题复盘</h2></div><span class="muted" th:text="#{exam.resultNote}">答案与社区投票仅在提交后展示</span></div><article th:each="review : ${examResult.reviews}" class="result-question panel"><div class="question-card-top"><span class="question-number" th:text="${#locale.language == 'en' ? 'Question ' + review.question.questionNumber : '第 ' + review.question.questionNumber + ' 题'}">Question 1</span><span class="result-badge" th:classappend="${review.correct} ? 'correct' : (${review.answered} ? 'incorrect' : 'unanswered')" th:text="${review.correct ? #messages.msg('exam.correctBadge') : (review.answered ? #messages.msg('exam.incorrectBadge') : #messages.msg('exam.unansweredBadge'))}">✓ Correct</span></div><h3 class="question-text" th:text="${review.question.questionText}">Question text</h3><div class="option-list compact-options"><div th:each="option : ${review.question.options}" class="option-row study-option" th:classappend="${option.correct} ? 'is-correct' : (${option.selected} ? 'is-selected' : '')"><span class="option-label" th:text="${option.label}">A</span><span class="option-copy" th:text="${option.text}">Option</span><span class="option-status" th:if="${option.correct}" th:text="#{common.correctAnswer}">✓ 正确答案</span><span class="option-status wrong-mark" th:if="${option.selected and !option.correct}" th:text="#{common.yourAnswer}">✕ 你的选择</span></div></div><div class="result-meta"><span><span th:text="#{exam.yourAnswer}">Your Answer:</span> <b th:text="${review.answered ? #strings.listJoin(review.selectedAnswers, ', ') : #messages.msg('common.unanswered')}">A</b></span><span><span th:text="#{exam.correctAnswer}">Correct Answer:</span> <b th:text="${#strings.listJoin(review.correctAnswers, ', ')}">C</b></span></div><div class="vote-section" th:if="${review.hasVotes}"><div class="section-label" th:text="#{study.votes}">COMMUNITY VOTE DISTRIBUTION</div><div th:each="vote : ${review.communityVotes}" class="vote-row"><span th:text="${vote.answerCombination}">C</span><div class="vote-track"><div class="vote-fill" th:style="|width: ${vote.percentage}%|"></div></div><strong th:text="${vote.percentage + '%'}">58%</strong></div></div></article></section>
</main></div><script th:src="@{/js/app.js}"></script></body></html>
