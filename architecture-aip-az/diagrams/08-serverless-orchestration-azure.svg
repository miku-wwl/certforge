  <text x="1041" y="266" class="node-title">Logic Apps / Review UI</text><text x="1041" y="287" class="node-sub">human approval</text>
  <path d="M940 450 H972 V272 H996" class="flow"/>
  <text x="972" y="258" class="edge">approval request</text>

  <rect x="991" y="335" width="194" height="88" class="func"/>
  <g transform="translate(1005,353)"><path d="M0 18L11 0h11l-6 12h10L10 34l4-14H0z" fill="#ffb000"/><path d="M19 5l8 8-8 8" fill="none" stroke="#2e91d5" stroke-width="2.5"/></g>
  <text x="1047" y="354" class="node-title">Callback Function</text><text x="1047" y="374" class="node-sub">HTTP Trigger · authenticated</text><text x="1047" y="392" class="tiny">dedup gate → RaiseEventAsync</text><text x="1047" y="407" class="tiny">(instanceId, “ApprovalReceived”)</text>
  <path d="M1013 289 V335" class="flow"/>

  <!-- external services -->
  <g transform="translate(1246,244)"><ellipse cx="16" cy="7" rx="14" ry="5" fill="#32c7b5"/><rect x="2" y="7" width="28" height="22" fill="#e7f8f5" stroke="#2aa89b"/><ellipse cx="16" cy="29" rx="14" ry="5" fill="#a9e9df" stroke="#2aa89b"/><line x1="2" y1="18" x2="30" y2="18" stroke="#2aa89b"/></g>
  <text x="1290" y="255" class="node-title">Payload Blob Storage</text><text x="1290" y="276" class="node-sub">large payload / URI only</text>

  <g transform="translate(1247,348)" fill="none" stroke="#27b9dd" stroke-width="1.8"><ellipse cx="17" cy="17" rx="16" ry="7"/><ellipse cx="17" cy="17" rx="7" ry="16" transform="rotate(45 17 17)"/><ellipse cx="17" cy="17" rx="7" ry="16" transform="rotate(-45 17 17)"/><circle cx="17" cy="17" r="3" fill="#27b9dd"/></g>
  <text x="1291" y="359" class="node-title">Azure Cosmos DB</text><text x="1291" y="380" class="node-sub">conditional write / dedup gate</text><text x="1291" y="396" class="node-sub">approval_request_id / instance_id</text>

  <g transform="translate(1248,458)" fill="#edf5ff" stroke="#2775c9" stroke-width="1.5"><rect x="0" y="0" width="34" height="30" rx="2"/><path d="M0 8h34M8 8v22M22 8v22"/></g>
  <text x="1291" y="469" class="node-title">Durable Task Scheduler</text><text x="1291" y="490" class="node-sub">managed task hub / history</text><text x="1291" y="506" class="node-sub">instance state</text>

  <g transform="translate(1252,564)"><path d="M0 30L12 0h18l-7 14h12L20 34H7l5-12z" fill="#6f4ddf"/><circle cx="27" cy="5" r="4" fill="#9a7df0"/></g>
  <text x="1291" y="579" class="node-title">Microsoft Foundry</text><text x="1291" y="600" class="node-sub">model / agent inference</text>

  <g transform="translate(1249,648)" fill="#fff" stroke="#1976d2" stroke-width="1.8"><rect x="0" y="0" width="30" height="23" rx="2"/><path d="M2 3l13 10L28 3" fill="none"/></g>
  <text x="1291" y="660" class="node-title">Service Bus</text><text x="1291" y="678" class="node-sub">manual intervention queue</text>

  <g transform="translate(1248,715)" fill="#f8fbff" stroke="#4b7fb8" stroke-width="1.6"><rect x="0" y="0" width="32" height="32" rx="5"/><circle cx="16" cy="9" r="4" fill="#fff"/><path d="M8 26c1-8 15-8 16 0" fill="none"/></g>
  <text x="1291" y="726" class="node-title">Ops Worker / Logic App</text><text x="1291" y="744" class="node-sub">consume · retry / dead-letter</text>

  <g transform="translate(1249,770)" fill="#fff" stroke="#f97316" stroke-width="1.8"><rect x="0" y="0" width="30" height="23" rx="2"/><path d="M2 3l13 10L28 3" fill="none"/></g>
  <text x="1291" y="782" class="node-title">Service Bus DLQ</text><text x="1291" y="800" class="tiny">dead-letter subqueue · failed intervention messages</text>

  <!-- callback gate: Callback Function owns both dedup check and RaiseEventAsync -->
  <path d="M1185 379 H1205 V365 H1247" class="dash"/>
  <text x="1230" y="346" text-anchor="end" class="edge">dedup write</text>

  <path d="M991 401 H965 V525 H588 V567 H574" class="blueDash"/>
  <rect x="622" y="507" width="304" height="18" rx="4" fill="#fff" opacity="0.96"/>
  <text x="630" y="520" class="edge-blue">accepted · RaiseEventAsync(instanceId, “ApprovalReceived”)</text>

  <!-- external interaction corridors -->
  <path d="M990 316 H1012 V236 H1234 V260 H1246" class="dash"/>
  <text x="1082" y="228" class="edge">Blob URI / metadata</text>

  <path d="M957 473 H1248" class="dash"/>
  <text x="1012" y="464" class="edge">Durable runtime / orchestration state</text>

  <!-- inference corridor stays below Human Approval nodes -->
  <path d="M945 347 H965 V620 H1235 V579 H1252" class="dash"/>
  <text x="1043" y="612" class="edge">model inference</text>

  <path d="M860 740 H975 V660 H1249" class="dash"/>
  <text x="1025" y="652" class="edge">external message</text>

  <!-- queue consumer makes DLQ semantics explicit -->
  <path d="M1264 683 V715" class="flow"/>
  <text x="1278" y="704" class="edge">receive</text>
  <path d="M1264 747 V770" class="flow"/>
  <text x="1278" y="762" class="edge-orange">retry exhausted / explicit</text>

  <!-- footer -->
  <rect x="48" y="866" width="360" height="58" rx="7" fill="#f8fbff" stroke="#9ac0e8"/>
  <circle cx="74" cy="895" r="12" fill="#fff" stroke="#1670d2" stroke-width="1.6"/><text x="74" y="900" text-anchor="middle" font-size="15" font-weight="700" fill="#1670d2">i</text>
  <text x="98" y="889" class="note">Activity retry / try-catch / Timeout /</text><text x="98" y="908" class="note">Explicit Compensation 属于 Durable 编排</text>

  <rect x="424" y="866" width="386" height="58" rx="7" fill="#f8fbff" stroke="#9ac0e8"/>
  <circle cx="450" cy="895" r="12" fill="#fff" stroke="#1670d2" stroke-width="1.6"/><text x="450" y="900" text-anchor="middle" font-size="15" font-weight="700" fill="#1670d2">i</text>
  <text x="474" y="889" class="note">DLQ 表示消费重试耗尽 / 显式死信，</text><text x="474" y="908" class="note">不代表整个 Durable 工作流失败</text>

  <rect x="826" y="866" width="350" height="58" rx="7" fill="#f8fbff" stroke="#9ac0e8"/>
  <circle cx="852" cy="895" r="12" fill="#fff" stroke="#1670d2" stroke-width="1.6"/><text x="852" y="900" text-anchor="middle" font-size="15" font-weight="700" fill="#1670d2">i</text>
  <text x="876" y="889" class="note">大 payload 存放于 Blob，</text><text x="876" y="908" class="note">流程中传递 URI 与 metadata</text>

  <rect x="1192" y="866" width="326" height="58" rx="7" fill="#fff" stroke="#9ac0e8"/>
  <path d="M1218 887H1270" class="flow"/><text x="1285" y="891" class="legend">主路径 / 控制流</text>
  <path d="M1218 907H1270" class="dash"/><text x="1285" y="911" class="legend">状态 / 回调 / 外部交互</text>
