  <g transform="translate(70,250)"><ellipse cx="16" cy="7" rx="14" ry="5" fill="#32c7b5"/><rect x="2" y="7" width="28" height="22" fill="#e7f8f5" stroke="#2aa89b"/><ellipse cx="16" cy="29" rx="14" ry="5" fill="#a9e9df" stroke="#2aa89b"/><line x1="2" y1="18" x2="30" y2="18" stroke="#2aa89b"/></g>
  <text x="118" y="263" class="node-title">Input Blob Storage</text><text x="118" y="284" class="node-sub">document uploaded</text>
  <g transform="translate(70,345)" fill="none" stroke="#2e8bd3" stroke-width="3" stroke-linecap="round"><path d="M3 8H25M19 3l6 5-6 5"/><path d="M29 22H7M13 17l-6 5 6 5"/></g>
  <text x="118" y="358" class="node-title">Azure Event Grid</text><text x="118" y="379" class="node-sub">blob created / event routing</text>
  <g transform="translate(70,488)" stroke="#1686d9" stroke-width="2" fill="none"><circle cx="16" cy="9" r="7"/><path d="M4 30c1-10 23-10 24 0"/></g>
  <text x="118" y="500" class="node-title">Client / Caller</text><text x="118" y="522" class="node-sub">HTTP client</text>
  <g transform="translate(70,578)" fill="#e8f5fd" stroke="#16a3dd" stroke-width="2"><path d="M6 27C-1 26-2 16 5 14 7 4 21 3 25 12c9-1 12 13 4 15Z"/><circle cx="16" cy="21" r="4" fill="#fff"/></g>
  <text x="118" y="590" class="node-title">API Management</text><text x="118" y="612" class="node-sub">HTTP request</text>

  <!-- durable scope -->
  <rect x="315" y="218" width="642" height="590" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.7"/>
  <path d="M338 236 l14 -18 h10 l-7 13 h10 l-18 25 4-16 h-13z" fill="#7c3aed"/>
  <text x="371" y="246" class="scope">Durable Functions · Orchestration Scope</text>

  <!-- top functions: one trigger per Function -->
  <rect x="335" y="268" width="150" height="58" class="func"/>
  <g transform="translate(347,280)"><path d="M0 18L11 0h11l-6 12h10L10 34l4-14H0z" fill="#ffb000"/><path d="M19 5l8 8-8 8" fill="none" stroke="#2e91d5" stroke-width="2.5"/></g>
  <text x="389" y="291" class="node-title">Event Grid Starter</text><text x="389" y="312" class="node-sub">Event Grid Trigger</text>

  <rect x="335" y="338" width="150" height="58" class="func"/>
  <g transform="translate(347,350)"><path d="M0 18L11 0h11l-6 12h10L10 34l4-14H0z" fill="#ffb000"/><path d="M19 5l8 8-8 8" fill="none" stroke="#2e91d5" stroke-width="2.5"/></g>
  <text x="389" y="361" class="node-title">HTTP Starter</text><text x="389" y="382" class="node-sub">HTTP Trigger</text>

  <rect x="515" y="292" width="165" height="76" class="func"/>
  <g transform="translate(528,310)"><path d="M0 18L11 0h11l-6 12h10L10 34l4-14H0z" fill="#ffb000"/><path d="M19 5l8 8-8 8" fill="none" stroke="#2e91d5" stroke-width="2.5"/></g>
  <text x="570" y="315" class="node-title">Durable Orchestrator</text><text x="570" y="336" class="node-sub">activity retry · try/catch</text><text x="570" y="352" class="node-sub">explicit compensation</text>

  <rect x="700" y="292" width="120" height="76" class="pattern"/>
  <g transform="translate(711,310)" fill="none" stroke="#7c3aed" stroke-width="1.8"><rect x="0" y="0" width="28" height="30" rx="4"/><circle cx="7" cy="7" r="2" fill="#7c3aed"/><circle cx="21" cy="7" r="2" fill="#7c3aed"/><circle cx="14" cy="23" r="2" fill="#7c3aed"/><path d="M7 9v6h7m7-6v6h-7m0 0v6"/></g>
  <text x="747" y="315" class="node-title">Fan-out / Fan-in</text><text x="747" y="338" class="node-sub">parallel activities</text>

  <rect x="835" y="292" width="110" height="76" class="func"/>
  <g transform="translate(846,310)"><path d="M0 18L11 0h11l-6 12h10L10 34l4-14H0z" fill="#ffb000"/><path d="M19 5l8 8-8 8" fill="none" stroke="#2e91d5" stroke-width="2.5"/></g>
  <text x="886" y="315" class="node-title">Activity Functions</text><text x="886" y="336" class="node-sub">validate / transform</text><text x="886" y="352" class="node-sub">invoke model</text>

  <!-- both starters start the same orchestration -->
  <path d="M485 297 H500 V318 H515" class="flow"/>
  <path d="M485 367 H500 V342 H515" class="flow"/>
  <text x="515" y="280" class="tiny">deterministic instanceId · idempotent start</text>
  <path d="M680 330 H700" class="flow"/>
  <path d="M820 330 H835" class="flow"/>

  <!-- entry chains -->
  <path d="M216 270 H245 V358 H256" class="flow"/>
  <text x="224" y="247" class="edge">blob created</text>
  <path d="M216 358 H300 V297 H335" class="flow"/>
  <text x="250" y="346" class="edge">event</text>

  <path d="M216 495 H245 V589 H256" class="flow"/>
  <text x="228" y="548" class="edge">HTTP</text>
  <path d="M216 589 H300 V367 H335" class="flow"/>
  <text x="250" y="579" class="edge">HTTP</text>

  <!-- approval activity: complete before wait/timer race begins -->
  <rect x="770" y="410" width="180" height="80" class="func"/>
  <g transform="translate(783,432)"><path d="M0 18L11 0h11l-6 12h10L10 34l4-14H0z" fill="#ffb000"/><path d="M19 5l8 8-8 8" fill="none" stroke="#2e91d5" stroke-width="2.5"/></g>
  <text x="827" y="436" class="node-title">Approval Activity</text><text x="827" y="457" class="node-sub">create / send approval</text><text x="827" y="473" class="node-sub">request</text>
  <path d="M597 368 V388 H750 V450 H770" class="flow"/>

  <!-- wait + timer start only after Approval Activity completes -->
  <rect x="390" y="535" width="184" height="64" class="pattern"/>
  <g transform="translate(403,550)" fill="none" stroke="#7c3aed" stroke-width="2"><circle cx="13" cy="14" r="12"/><path d="M13 5v10l7 4"/><path d="M24 22l5 1-1 5"/></g>
  <text x="440" y="560" class="node-title">Wait for External Event</text><text x="440" y="581" class="node-sub">“ApprovalReceived”</text>

  <rect x="615" y="535" width="158" height="64" class="pattern"/>
  <g transform="translate(628,550)" fill="none" stroke="#7c3aed" stroke-width="2"><circle cx="13" cy="14" r="12"/><path d="M13 5v10l7 4"/></g>
  <text x="665" y="560" class="node-title">Durable Timer</text><text x="665" y="581" class="node-sub">approval timeout</text>

  <path d="M860 490 V505 H482 V535" class="flow"/>
  <path d="M860 505 H694 V535" class="flow"/>
  <text x="780" y="500" class="edge">activity completed</text>

  <rect x="515" y="630" width="160" height="58" class="pattern"/>
  <text x="595" y="652" text-anchor="middle" class="node-title">WhenAny</text>
  <text x="595" y="674" text-anchor="middle" class="node-sub">(Approval, Timeout)</text>
  <path d="M482 599 V615 H558 V630" class="flow"/>
  <path d="M694 599 V615 H632 V630" class="flow"/>

  <rect x="378" y="714" width="186" height="56" class="continue"/>
  <circle cx="401" cy="742" r="11" fill="#fff" stroke="#22a35a" stroke-width="1.7"/>
  <path d="M395 742l4 4 8-9" fill="none" stroke="#22a35a" stroke-width="2"/>
