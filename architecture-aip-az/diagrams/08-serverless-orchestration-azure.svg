  <path d="M558 688 V702 H471 V714" class="flow"/>
  <text x="492" y="700" class="edge">approved</text>

  <rect x="640" y="708" width="220" height="64" class="func"/>
  <g transform="translate(653,725)"><path d="M0 18L11 0h11l-6 12h10L10 34l4-14H0z" fill="#ffb000"/><path d="M19 5l8 8-8 8" fill="none" stroke="#2e91d5" stroke-width="2.5"/></g>
  <text x="696" y="731" class="node-title">Publish Manual Intervention</text><text x="696" y="747" class="node-title">Activity</text><text x="696" y="764" class="tiny">publish escalation message</text>
  <path d="M632 688 V696 H750 V708" class="flow"/>
  <text x="700" y="700" class="edge">timeout</text>

