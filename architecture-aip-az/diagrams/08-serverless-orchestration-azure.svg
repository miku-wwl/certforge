<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#22354a"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1670d2"/>
    </marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC","Segoe UI",Arial,sans-serif;fill:#0f172a}
      .title{font-size:29px;font-weight:700;fill:#102a56}
      .subtitle{font-size:15px;fill:#405a7a}
      .brand{font-size:18px;font-weight:700;fill:#143b6f}
      .region{font-size:15px;font-weight:650;fill:#1263b5}
      .lane{font-size:14.5px;font-weight:700;fill:#145da8}
      .scope{font-size:18px;font-weight:700;fill:#6d28d9}
      .node-title{font-size:12.5px;font-weight:700}
      .node-sub{font-size:10.5px;fill:#526377}
      .tiny{font-size:9.5px;fill:#526377}
      .edge{font-size:10px;fill:#334155}
      .edge-blue{font-size:10px;fill:#1263b5;font-weight:650}
      .edge-orange{font-size:10px;fill:#c75a00;font-weight:650}
      .note{font-size:12px;fill:#334155}
      .legend{font-size:12px;fill:#334155}
      .flow{fill:none;stroke:#22354a;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#22354a;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6;marker-end:url(#arrow)}
      .blueDash{fill:none;stroke:#1670d2;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6;marker-end:url(#arrowBlue)}
      .func{fill:#fff;stroke:#f0a51b;stroke-width:1.5;rx:9;filter:url(#shadow)}
      .pattern{fill:#fbf8ff;stroke:#8b5cf6;stroke-width:1.5;stroke-dasharray:4 3;rx:9}
      .continue{fill:#f0fdf4;stroke:#22a35a;stroke-width:1.5;rx:9}
      .service{fill:#fff;stroke:#93bde8;stroke-width:1.4;rx:9;filter:url(#shadow)}
    </style>
  </defs>

  <rect x="1" y="1" width="1598" height="998" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="48" y="41" class="title">08 Serverless 编排与人工审批 · Azure</text>
  <text x="1548" y="39" text-anchor="end" class="subtitle">Durable Functions + Logic Apps</text>
