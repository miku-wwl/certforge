<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family:"Microsoft YaHei","Segoe UI",Arial,sans-serif; fill:#0f172a; }
      .title { font-size:28px; font-weight:700; fill:#111827; }
      .subtitle { font-size:14px; fill:#64748b; }
      .cloud { font-size:17px; font-weight:650; }
      .region { font-size:14px; font-weight:650; fill:#334155; }
      .section { font-size:14px; font-weight:700; }
      .node-title { font-size:14px; font-weight:700; }
      .node-sub { font-size:11px; fill:#475569; }
      .small { font-size:10.5px; fill:#475569; }
      .tiny { font-size:9.5px; fill:#64748b; }
      .edge-label { font-size:10.5px; fill:#475569; }
      .badge { font-size:10px; font-weight:700; fill:white; }
      .footer-title { font-size:12px; font-weight:700; }
      .footer-sub { font-size:10px; fill:#64748b; }
      .solid { fill:none; stroke:#334155; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
      .control { fill:none; stroke:#475569; stroke-width:1.8; stroke-dasharray:7 6; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
      .audit { fill:none; stroke:#64748b; stroke-width:1.7; stroke-dasharray:2.5 5; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
    </style>
  </defs>

  <!-- Canvas -->
  <rect x="2" y="2" width="1596" height="996" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="74" y="40" class="title">05 Prompt 与运行时配置生命周期 · Azure</text>
  <text x="1470" y="39" text-anchor="end" class="subtitle">Prompt-as-code + Evaluation + Approvals + Pinned Config + Audit</text>

  <!-- Azure frame -->
  <rect x="74" y="66" width="1452" height="902" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <rect x="74" y="66" width="34" height="34" fill="#0078d4"/>
  <text x="91" y="89" text-anchor="middle" class="badge">AZ</text>
  <text x="118" y="89" class="cloud">Microsoft Azure</text>

  <!-- Region -->
  <rect x="120" y="115" width="1360" height="752" rx="3" fill="#fbfdff" stroke="#0078d4" stroke-width="1.4" stroke-dasharray="7 6"/>
  <rect x="120" y="115" width="32" height="32" fill="#0078d4"/>
  <text x="136" y="137" text-anchor="middle" class="badge">R</text>
  <text x="162" y="137" class="region">Azure Region / Subscription</text>

  <!-- Section 1 -->
  <rect x="180" y="168" width="800" height="270" rx="5" fill="#ffffff" fill-opacity="0.92" stroke="#0078d4" stroke-width="1.8"/>
  <rect x="180" y="168" width="34" height="30" fill="#0078d4"/>
  <text x="197" y="189" text-anchor="middle" class="badge">1</text>
  <text x="224" y="189" class="section" fill="#075985">RELEASE &amp; CONTROL PLANE</text>

  <!-- Platform team -->
  <circle cx="220" cy="276" r="13" fill="#fff" stroke="#334155" stroke-width="2"/>
  <path d="M220 289 V326 M196 304 H244 M220 326 L201 351 M220 326 L239 351" fill="none" stroke="#334155" stroke-width="2"/>
  <text x="220" y="371" text-anchor="middle" class="node-sub">平台团队</text>

  <!-- Git -->
  <rect x="255" y="235" width="165" height="100" rx="6" fill="#fff" stroke="#0078d4" stroke-width="2" filter="url(#shadow)"/>
  <rect x="270" y="251" width="38" height="38" rx="8" fill="#0078d4"/>
  <text x="289" y="275" text-anchor="middle" class="badge">GIT</text>
  <text x="317" y="257" class="node-title">Git / Azure Repos</text>
  <text x="317" y="278" class="node-sub">Prompt + Agent Definition</text>
  <text x="317" y="297" class="node-sub">Prompt-as-code / PR</text>
  <text x="317" y="316" class="small">Source of truth</text>

  <!-- Evaluation -->
  <rect x="435" y="235" width="170" height="100" rx="6" fill="#fff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <rect x="450" y="251" width="38" height="38" rx="8" fill="#7c3aed"/>
  <text x="469" y="275" text-anchor="middle" class="badge">EVAL</text>
  <text x="492" y="257" class="node-title">Foundry Evaluation</text>
  <text x="492" y="278" class="node-sub">Quality / Safety</text>
  <text x="492" y="297" class="node-sub">Regression / Cost / Latency</text>
  <text x="492" y="316" class="small">Automated evaluation gate</text>

  <!-- Approval -->
  <rect x="620" y="235" width="175" height="100" rx="6" fill="#fff" stroke="#0078d4" stroke-width="2" filter="url(#shadow)"/>
  <rect x="635" y="251" width="38" height="38" rx="8" fill="#2563eb"/>
  <text x="654" y="275" text-anchor="middle" class="badge">GATE</text>
  <text x="681" y="257" class="node-title">Azure Pipelines</text>
  <text x="681" y="278" class="node-sub">Approvals &amp; Checks</text>
  <text x="681" y="297" class="node-sub">Environment / policy gates</text>
  <text x="681" y="316" class="small">Promote only if approved</text>

  <!-- Approved Release Manifest: logical artifact, not an Azure managed service -->
  <rect x="810" y="205" width="165" height="175" rx="6" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="6 4" filter="url(#shadow)"/>
  <path d="M826 224 H850 L862 236 V264 H826 Z M850 224 V236 H862" fill="#fff" stroke="#0ea5e9" stroke-width="1.8"/>
  <text x="902" y="226" text-anchor="middle" class="tiny">LOGICAL RELEASE ARTIFACT · RELEASE TRUTH</text>
  <text x="902" y="248" text-anchor="middle" class="node-title">Approved Release</text>
  <text x="902" y="266" text-anchor="middle" class="node-title">Manifest</text>
  <text x="826" y="291" class="small">• prompt_version</text>
  <text x="826" y="307" class="small">• agent_version</text>
  <text x="826" y="323" class="small">• model_set</text>
  <text x="826" y="339" class="small">• routing_policy_version</text>
  <text x="826" y="355" class="small">• config_snapshot_id</text>
  <text x="826" y="371" class="small">• release_id</text>

  <!-- Release flow -->
  <path class="solid" d="M244 304 H255"/>
  <path class="solid" d="M420 285 H435"/>
  <path class="solid" d="M605 285 H620"/>
  <path class="solid" d="M795 285 H810"/>
  <text x="520" y="218" text-anchor="middle" class="edge-label">evaluate</text>
  <text x="705" y="218" text-anchor="middle" class="edge-label">approve / promote</text>

  <!-- Section 2 -->
  <rect x="1010" y="168" width="390" height="270" rx="5" fill="#ffffff" fill-opacity="0.92" stroke="#7c3aed" stroke-width="1.8"/>
  <rect x="1010" y="168" width="34" height="30" fill="#7c3aed"/>
  <text x="1027" y="189" text-anchor="middle" class="badge">2</text>
  <text x="1054" y="189" class="section" fill="#6d28d9">RUNTIME CONFIGURATION</text>

  <!-- App Config -->
  <rect x="1032" y="230" width="164" height="135" rx="6" fill="#fff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="1058" cy="257" r="20" fill="#7c3aed"/>
  <text x="1058" y="261" text-anchor="middle" class="badge">AC</text>
  <text x="1084" y="249" class="node-title">Azure App</text>
  <text x="1084" y="267" class="node-title">Configuration</text>
  <text x="1047" y="294" class="small">Feature / Variant Flags</text>
  <text x="1047" y="311" class="small">Labels / Snapshot Reference</text>
  <text x="1047" y="328" class="small">Immutable Snapshot / LKG</text>
  <text x="1047" y="345" class="small">Selected by config_snapshot_id</text>

  <!-- Key Vault -->
  <rect x="1215" y="230" width="164" height="135" rx="6" fill="#fff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="1241" cy="257" r="20" fill="#f59e0b"/>
  <text x="1241" y="261" text-anchor="middle" class="badge">KV</text>
  <text x="1267" y="249" class="node-title">Azure Key Vault</text>
  <text x="1230" y="294" class="small">Secrets / Credentials</text>
  <text x="1230" y="311" class="small">RBAC / least privilege</text>
  <text x="1230" y="328" class="small">AuditEvent / diagnostics</text>
  <text x="1230" y="345" class="small">Accessed by Router identity</text>

  <rect x="1042" y="382" width="326" height="28" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="1205" y="400" text-anchor="middle" class="tiny">Manifest pins config snapshot; Router uses its managed identity for Key Vault access</text>

  <!-- Section 3 -->
  <rect x="180" y="470" width="1220" height="180" rx="5" fill="#ffffff" fill-opacity="0.92" stroke="#0284c7" stroke-width="1.8"/>
  <rect x="180" y="470" width="34" height="30" fill="#0284c7"/>
  <text x="197" y="491" text-anchor="middle" class="badge">3</text>
  <text x="224" y="491" class="section" fill="#075985">REQUEST PATH &amp; RUNTIME ROUTING</text>

  <!-- Client -->
  <rect x="215" y="522" width="125" height="82" rx="6" fill="#fff" stroke="#64748b" stroke-width="1.8"/>
  <circle cx="240" cy="546" r="17" fill="#475569"/>
  <text x="240" y="550" text-anchor="middle" class="badge">C</text>
  <text x="278" y="545" class="node-title">Client</text>
  <text x="278" y="566" class="node-sub">App / API caller</text>
  <text x="278" y="585" class="small">Request</text>

  <!-- APIM -->
  <rect x="385" y="512" width="180" height="102" rx="6" fill="#fff" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="412" cy="540" r="20" fill="#0284c7"/>
  <text x="412" y="544" text-anchor="middle" class="badge">APIM</text>
  <text x="440" y="536" class="node-title">APIM AI Gateway</text>
  <text x="400" y="566" class="small">Auth / Policy / Rate limit</text>
  <text x="400" y="583" class="small">Token quota / Observability</text>
  <text x="400" y="600" class="small">Unified AI endpoint</text>

  <!-- Router -->
  <rect x="700" y="505" width="220" height="116" rx="6" fill="#fff" stroke="#0ea5e9" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="730" cy="535" r="21" fill="#0ea5e9"/>
  <text x="730" y="539" text-anchor="middle" class="badge">RT</text>
  <text x="760" y="530" class="node-title">Function / Container Router</text>
  <text x="718" y="559" class="small">Approved release + pinned config</text>
  <text x="718" y="576" class="small">Variant / tenant / business policy</text>
  <text x="718" y="593" class="small">Model-set routing / fallback</text>
  <text x="718" y="610" class="small">Managed Identity + secret resolution</text>

  <!-- Models -->
  <rect x="1030" y="522" width="150" height="82" rx="6" fill="#fff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="1057" cy="548" r="19" fill="#7c3aed"/>
  <text x="1057" y="552" text-anchor="middle" class="badge">M-A</text>
  <text x="1082" y="544" class="node-title">Foundry Model A</text>
  <text x="1045" y="575" class="node-sub">低成本 / 低延迟</text>
  <text x="1045" y="594" class="small">General traffic</text>

  <rect x="1220" y="522" width="150" height="82" rx="6" fill="#fff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="1247" cy="548" r="19" fill="#7c3aed"/>
  <text x="1247" y="552" text-anchor="middle" class="badge">M-B</text>
  <text x="1272" y="544" class="node-title">Foundry Model B</text>
  <text x="1235" y="575" class="node-sub">高质量 / 专用</text>
  <text x="1235" y="594" class="small">Premium / specialist</text>

  <!-- Request path edges -->
  <path class="solid" d="M340 563 H385"/>
  <path class="solid" d="M565 563 H700"/>
  <path class="solid" d="M920 550 H1030"/>
  <path class="solid" d="M920 585 H970 V626 H1195 V563 H1220"/>
  <text x="632" y="550" text-anchor="middle" class="edge-label">validated request</text>
  <text x="974" y="536" text-anchor="middle" class="edge-label">route</text>

  <!-- Control/config inputs into router -->
  <path class="control" d="M892 380 V428 H780 V505"/>
  <rect x="768" y="416" width="164" height="20" rx="3" fill="#fff"/>
  <text x="850" y="430" text-anchor="middle" class="edge-label">pinned release manifest</text>

  <path class="control" d="M1114 365 V442 H835 V505"/>
  <rect x="943" y="431" width="160" height="20" rx="3" fill="#fff"/>
  <text x="1023" y="445" text-anchor="middle" class="edge-label">fetch pinned snapshot</text>

  <!-- Secret access is initiated by the Router's managed identity -->
  <path class="control" d="M885 505 V464 H1297 V365"/>
  <rect x="1090" y="453" width="186" height="20" rx="3" fill="#fff"/>
  <text x="1183" y="467" text-anchor="middle" class="edge-label">secret access via managed identity</text>

  <!-- Section 4 audit -->
  <rect x="180" y="680" width="1220" height="160" rx="5" fill="#ffffff" fill-opacity="0.94" stroke="#16a34a" stroke-width="1.8"/>
  <rect x="180" y="680" width="34" height="30" fill="#16a34a"/>
  <text x="197" y="701" text-anchor="middle" class="badge">4</text>
  <text x="224" y="701" class="section" fill="#15803d">AUDIT &amp; CHANGE TRACEABILITY</text>

  <rect x="210" y="727" width="245" height="82" rx="6" fill="#fff" stroke="#16a34a" stroke-width="1.8"/>
  <circle cx="238" cy="754" r="19" fill="#16a34a"/>
  <text x="238" y="758" text-anchor="middle" class="badge">ADO</text>
  <text x="268" y="748" class="node-title">Azure DevOps Audit</text>
  <text x="268" y="770" class="node-sub">Git / PR / Pipeline / Approval</text>
  <text x="268" y="790" class="small">Release governance evidence</text>

  <rect x="495" y="727" width="245" height="82" rx="6" fill="#fff" stroke="#16a34a" stroke-width="1.8"/>
  <circle cx="523" cy="754" r="19" fill="#2563eb"/>
  <text x="523" y="758" text-anchor="middle" class="badge">ACT</text>
  <text x="553" y="748" class="node-title">Azure Activity Log</text>
  <text x="553" y="770" class="node-sub">Azure resource control-plane</text>
  <text x="553" y="790" class="small">Resource / RBAC / network changes</text>

  <rect x="780" y="727" width="245" height="82" rx="6" fill="#fff" stroke="#16a34a" stroke-width="1.8"/>
  <circle cx="808" cy="754" r="19" fill="#7c3aed"/>
  <text x="808" y="758" text-anchor="middle" class="badge">ACA</text>
  <text x="838" y="748" class="node-title">App Configuration Audit Logs</text>
  <text x="838" y="770" class="node-sub">AACAudit / data-plane writes</text>
  <text x="838" y="790" class="small">Key-values / flags / snapshot-ref changes</text>

  <rect x="1065" y="727" width="245" height="82" rx="6" fill="#fff" stroke="#16a34a" stroke-width="1.8"/>
  <circle cx="1093" cy="754" r="19" fill="#f59e0b"/>
  <text x="1093" y="758" text-anchor="middle" class="badge">KVA</text>
  <text x="1123" y="748" class="node-title">Key Vault Audit Logs</text>
  <text x="1123" y="770" class="node-sub">Secret data-plane access audit</text>
  <text x="1123" y="790" class="small">Who / what / when / result</text>

  <!-- Audit edges routed to keep request path readable -->
  <path class="audit" d="M707 335 V446 H160 V768 H210"/>

  <path class="audit" d="M1114 365 V452 H1000 V692 H902 V727"/>
  <rect x="920" y="676" width="84" height="18" rx="3" fill="#fff"/>
  <text x="962" y="689" text-anchor="middle" class="edge-label">AACAudit</text>

  <path class="audit" d="M1297 365 V650 H1430 V702 H1188 V727"/>
  <rect x="1280" y="636" width="78" height="18" rx="3" fill="#fff"/>
  <text x="1319" y="649" text-anchor="middle" class="edge-label">AuditEvent</text>

  <!-- Legend -->
  <rect x="1010" y="814" width="360" height="22" rx="3" fill="#f8fafc"/>
  <line x1="1022" y1="825" x2="1054" y2="825" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1062" y="829" class="tiny">请求/数据流</text>
  <line x1="1120" y1="825" x2="1152" y2="825" stroke="#475569" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="1160" y="829" class="tiny">配置/控制流</text>
  <line x1="1222" y1="825" x2="1254" y2="825" stroke="#64748b" stroke-width="1.7" stroke-dasharray="2.5 5" marker-end="url(#arrow)"/>
  <text x="1262" y="829" class="tiny">审计/追踪流</text>

  <!-- Footer capability cards -->
  <rect x="92" y="890" width="270" height="58" rx="7" fill="#f8fbff" stroke="#dbeafe"/>
  <text x="112" y="913" class="footer-title" fill="#075985">Prompt-as-code</text>
  <text x="112" y="932" class="footer-sub">Git versioning + reviewable prompt / agent definitions</text>

  <rect x="382" y="890" width="270" height="58" rx="7" fill="#faf7ff" stroke="#e9d5ff"/>
  <text x="402" y="913" class="footer-title" fill="#6d28d9">Evaluation &amp; Promotion</text>
  <text x="402" y="932" class="footer-sub">Quality/safety regression → approval gate → release</text>

  <rect x="672" y="890" width="270" height="58" rx="7" fill="#faf7ff" stroke="#e9d5ff"/>
  <text x="692" y="913" class="footer-title" fill="#6d28d9">Snapshot &amp; Rollback</text>
  <text x="692" y="932" class="footer-sub">Immutable config snapshot + LKG restore path</text>

  <rect x="962" y="890" width="270" height="58" rx="7" fill="#f7fff8" stroke="#bbf7d0"/>
  <text x="982" y="913" class="footer-title" fill="#15803d">Audit Boundaries</text>
  <text x="982" y="932" class="footer-sub">Separate DevOps, control-plane, App Config &amp; Key Vault audit</text>

  <rect x="1252" y="890" width="250" height="58" rx="7" fill="#f8fbff" stroke="#dbeafe"/>
  <text x="1272" y="913" class="footer-title" fill="#075985">Gateway &amp; Routing</text>
  <text x="1272" y="932" class="footer-sub">APIM policy + business-aware runtime model routing</text>
</svg>
